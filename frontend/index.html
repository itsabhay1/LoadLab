<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142d27" />
    <link rel="icon" type="image/svg+xml" href="/loadlab-icon.svg" />
    <meta
      name="description"
      content="LoadLab — API load testing and performance analysis workspace."
    />
    <title>LoadLab · Overview</title>
    <script>
      (() => {
        const key = 'loadlab-theme';
        let preference;
        try {
          const saved = localStorage.getItem(key);
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch {}
        const resolved =
          preference ??
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', resolved === 'dark');
        document.documentElement.style.colorScheme = resolved;
        document.documentElement.dataset.theme = preference ?? 'system';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
